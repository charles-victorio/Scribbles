<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mask · POV — the world seen through them</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --ink:#05060a;
  --paper:#e9e6df;
  --mono:"Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --display:"Anton", Impact, "Arial Black", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block;touch-action:none}

#app{position:fixed;inset:0}
/* soft vignette so the void reads as depth, not a flat black card */
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(130% 100% at 50% 42%, transparent 45%, rgba(0,0,0,.55) 100%)}

#title{position:fixed;top:16px;left:18px;z-index:6;user-select:none;pointer-events:none}
#title h1{font-family:var(--display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
#title p{font-size:9px;letter-spacing:.22em;text-transform:uppercase;opacity:.5;margin-top:5px}

#hud{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 16px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:linear-gradient(transparent, rgba(0,0,0,.6) 60%)}
.btn{font:inherit;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);
  background:rgba(255,255,255,.04);border:1px solid rgba(233,230,223,.28);padding:8px 11px;cursor:pointer;
  transition:.13s;white-space:nowrap;backdrop-filter:blur(4px)}
.btn:hover{border-color:var(--paper)}
.btn.on{background:var(--paper);border-color:var(--paper);color:var(--ink);font-weight:700}

#load{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
  background:var(--ink);transition:opacity .8s ease;font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
#load.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="app"></div>
<div id="vig"></div>

<div id="title">
  <h1>Mask · POV</h1>
  <p>the outside world, only through them</p>
</div>

<div id="hud">
  <button class="btn on" id="b-butter">Butterflies</button>
</div>

<div id="load">opening the mask…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

/* =========================================================
   the picture: a dark head full of rainbow bokeh peels a
   mask aside, and behind the mask is a sunlit valley.
   here the player floats in that dark void. NPCs wander it.
   each NPC's face carries a little frustum "screen" — and
   that screen is the ONLY window onto the outside world.
========================================================= */

const WORLD_PARALLAX = 1;      // walk a few metres in the void -> glide far over the fields
const NPC_FOV = 50;
const LAYER_VOID = 1;          // shell, bokeh, butterflies, frustum apparatus — player camera only
const LAYER_OUTSIDE = 2;       // the sunlit valley — NPC cameras only
const RT_W = 512, RT_H = 384;
const RT_ASPECT = RT_W / RT_H;

// the frustum screen, as a fixed size (all NPCs identical)
const SCREEN_D = 1.4;
const SCREEN_H = 2 * SCREEN_D * Math.tan(THREE.MathUtils.degToRad(NPC_FOV) / 2);
const SCREEN_W = SCREEN_H * RT_ASPECT;

const host = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
host.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3.4, 14);
camera.layers.enable(LAYER_VOID);      // ...on top of the figures on layer 0

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 3;
controls.maxDistance = 34;
controls.target.set(0, 1.5, 0);
controls.autoRotateSpeed = 0.3;

/* =========================================================
   SHARED GLSL
========================================================= */
const GLSL_COMMON = /* glsl */`
  vec3 hsv2rgb(vec3 c){
    vec3 p = abs(fract(c.xxx + vec3(0.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0);
    return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
  }
  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
`;

const fx = [];   // every shimmering material — pumped with uTime each frame

/* =========================================================
   ONE SCENE, TWO AUDIENCES
   the player camera renders LAYER_VOID + the figures;
   each NPC camera renders LAYER_OUTSIDE + the figures, with
   the shared NPC material flipped to flat yellow.
========================================================= */
const scene = new THREE.Scene();
const VOID_BG = new THREE.Color(0x000000);
const setLayerDeep = (o, l) => { o.layers.set(l); o.children.forEach(c => setLayerDeep(c, l)); };

// -- backdrop shell: shimmering rainbow splotches on black, infinitely far
// (a camera-following sphere, so it never parallaxes)
const shellMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: GLSL_COMMON + /* glsl */`
    varying vec3 vDir;
    uniform float uTime;

    float h13(vec3 p){
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    float n3(vec3 x){
      vec3 i = floor(x), f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(mix(h13(i + vec3(0,0,0)), h13(i + vec3(1,0,0)), f.x),
            mix(h13(i + vec3(0,1,0)), h13(i + vec3(1,1,0)), f.x), f.y),
        mix(mix(h13(i + vec3(0,0,1)), h13(i + vec3(1,0,1)), f.x),
            mix(h13(i + vec3(0,1,1)), h13(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p){
      float s = 0.0, a = 0.55;
      for (int i = 0; i < 3; i++){ s += a * n3(p); p = p * 2.03 + 7.1; a *= 0.5; }
      return s;
    }

    void main(){
      vec3 d = normalize(vDir);
      float t = uTime;
      vec3 col = vec3(0.0);

      // four scales of rainbow splotches, each breathing at its own rate
      for (int k = 0; k < 4; k++){
        float fk = float(k);
        float sc = 2.3 + fk * 2.9;
        vec3 p = d * sc + fk * 19.3;
        vec3 drift = vec3(sin(t * 0.06 + fk), cos(t * 0.05 + fk * 2.0), sin(t * 0.042 + fk * 3.0)) * 0.4;

        float warp = fbm(p * 0.6 + drift);
        float n = fbm(p + warp * 1.5 + drift);

        float blob = smoothstep(0.55, 0.80, n);
        blob = blob * blob * (1.2 - 0.2 * blob);

        float hue = fract(warp * 1.2 + t * 0.03 + fk * 0.24);
        float shim = 0.4 + 0.6 * sin(t * 1.9 + n * 26.0 + fk * 1.7);
        col += hsv2rgb(vec3(hue, 0.9, 1.0)) * blob * (0.16 + 0.32 * shim) * (1.0 - fk * 0.2);
      }

      // faint wide wash so the black gaps still glimmer
      float g = fbm(d * 0.8 + t * 0.012);
      col += hsv2rgb(vec3(fract(g * 0.7 + t * 0.015), 0.55, 1.0)) * 0.025;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }
  `,
});
fx.push(shellMat);
const shell = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 32), shellMat);
shell.renderOrder = -1;
shell.layers.set(LAYER_VOID);
scene.add(shell);

// -- big out-of-focus bokeh discs drifting through the void
const BOKEH_VS = /* glsl */`
  varying vec2 vUv;
  void main(){
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const BOKEH_FS = GLSL_COMMON + /* glsl */`
  varying vec2 vUv;
  uniform float uTime;
  uniform float uSeed;
  void main(){
    float d = length(vUv - 0.5) * 2.0;
    float a = smoothstep(1.0, 0.0, d);
    a = a * a * a;                                   // soft to nothing well inside the quad
    float hue = fract(uSeed + uTime * 0.03);
    float shim = 0.6 + 0.4 * sin(uTime * 2.0 + uSeed * 30.0);
    vec3 col = hsv2rgb(vec3(hue, 0.7, 1.0)) * shim;
    gl_FragColor = vec4(col * a * 0.13, 1.0);
  }
`;
const bokeh = [];
const bokehGeo = new THREE.PlaneGeometry(1, 1);
for (let i = 0; i < 26; i++){
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSeed: { value: Math.random() } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: BOKEH_VS, fragmentShader: BOKEH_FS,
  });
  fx.push(mat);
  const m = new THREE.Mesh(bokehGeo, mat);
  const a = Math.random() * Math.PI * 2;
  const r = 14 + Math.random() * 34;
  m.position.set(Math.cos(a) * r, -6 + Math.random() * 22, Math.sin(a) * r);
  m.scale.setScalar(4 + Math.random() * 9);
  m.userData.spin = (Math.random() - 0.5) * 0.06;
  m.renderOrder = 1;
  m.layers.set(LAYER_VOID);
  bokeh.push(m);
  scene.add(m);
}

// -- wireframe floor: a taut cross-hatch that dissolves into the void
const floorMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    varying vec3 vW;
    void main(){
      vW = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: GLSL_COMMON + /* glsl */`
    varying vec3 vW;
    uniform float uTime;

    // anti-aliased grid: 1 on the strings, 0 in the gaps
    float grid(vec2 p, float cell){
      vec2 c = p / cell;
      vec2 g = abs(fract(c - 0.5) - 0.5) / fwidth(c);
      return 1.0 - min(min(g.x, g.y), 1.0);
    }

    void main(){
      vec2 p = vW.xz;
      float d = length(p);

      // only a patch under the NPCs' walk, plus a little margin, then gone
      float fade = 1.0 - smoothstep(8.0, 16.0, d);
      if (fade < 0.02) discard;

      float strings = grid(p, 0.7);                 // the square grid
      float frame   = grid(p, 5.6) * 0.6;           // occasional heavier line
      float lines = max(strings, frame);
      if (lines < 0.015) discard;

      float hue = fract(d * 0.02 - uTime * 0.03);
      float shim = 0.55 + 0.45 * sin(uTime * 1.6 + d * 0.6);
      vec3 col = mix(vec3(0.5, 0.58, 0.78), hsv2rgb(vec3(hue, 0.6, 1.0)), 0.4);

      gl_FragColor = vec4(col * lines * fade * (0.13 + 0.18 * shim), 1.0);
    }
  `,
});
fx.push(floorMat);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.renderOrder = 0;
floor.layers.set(LAYER_VOID);
scene.add(floor);

// -- shimmering rainbow butterflies
function butterflyGeo(){
  // four wing lobes, each a polygon fanned from the body at (0,0)
  const lobes = [
    [[0,0],[0.14,0.16],[0.52,0.64],[1.00,0.62],[1.14,0.22],[0.5,0.03]],   // R forewing
    [[0,0],[0.5,0.03],[0.84,-0.18],[0.80,-0.60],[0.42,-0.80],[0.08,-0.40]],// R hindwing
  ];
  const pos = [], wing = [];
  const emit = (p, mx) => {
    for (let i = 1; i < p.length - 1; i++){
      for (const q of [p[0], p[i], p[i + 1]]){
        pos.push(q[0] * mx, q[1], 0);
        wing.push(Math.abs(q[0]), q[1]);   // u = span from body, v = fore/hind
      }
    }
  };
  for (const l of lobes){ emit(l, 1); emit(l, -1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aWing', new THREE.Float32BufferAttribute(wing, 2));
  return g;
}
const butterflyMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    attribute float aSeed;
    attribute vec2 aWing;
    uniform float uTime;
    varying float vSeed;
    varying vec2 vWing;
    void main(){
      vSeed = aSeed;
      vWing = aWing;
      float flap = sin(uTime * (6.0 + aSeed * 5.0) + aSeed * 30.0);
      float ang = (0.12 + 1.25 * (0.5 + 0.5 * flap)) * sign(position.x);  // wings hinge on the body
      float c = cos(ang), s = sin(ang);
      vec3 p = position;
      p.xz = mat2(c, -s, s, c) * p.xz;
      vec4 world = modelMatrix * instanceMatrix * vec4(p, 1.0);
      float t = uTime;
      world.xyz += vec3(
        sin(t * 0.5  + aSeed * 12.0),
        sin(t * 0.42 + aSeed * 20.0) * 0.7 + sin(t * 1.7 + aSeed * 5.0) * 0.16,
        cos(t * 0.47 + aSeed * 8.0)
      ) * (0.5 + aSeed * 1.4);
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: GLSL_COMMON + /* glsl */`
    varying float vSeed;
    varying vec2 vWing;
    uniform float uTime;
    void main(){
      float span = clamp(length(vWing) / 1.1, 0.0, 1.0);
      // iridescent wash: hue rides the wing + time, edges shift cooler
      float hue = fract(vSeed * 3.0 + uTime * 0.05 + span * 0.35 + vWing.y * 0.12);
      vec3 col = hsv2rgb(vec3(hue, 0.9, 1.0));
      float shim = 0.5 + 0.5 * sin(uTime * 7.0 + vSeed * 50.0);
      col = mix(col, vec3(1.0), 0.16 * shim);
      float body = smoothstep(0.16, 0.02, length(vWing));   // bright thorax
      col += vec3(1.0) * body * 0.5;
      float a = (0.55 + 0.35 * shim) * (1.0 - 0.55 * span);  // fade toward the tips
      gl_FragColor = vec4(col * a, 1.0);
    }
  `,
});
fx.push(butterflyMat);
const BUTTERFLIES = 210;
const bGeo = butterflyGeo();
const butterflies = new THREE.InstancedMesh(bGeo, butterflyMat, BUTTERFLIES);
butterflies.frustumCulled = false;
{
  const seeds = new Float32Array(BUTTERFLIES);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < BUTTERFLIES; i++){
    const a = Math.random() * Math.PI * 2;
    const rad = 4.5 + Math.pow(Math.random(), 0.6) * 13;
    dummy.position.set(Math.cos(a) * rad, 0.4 + Math.random() * 9.5, Math.sin(a) * rad);
    dummy.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
    dummy.scale.setScalar(0.11 + Math.random() * 0.2);
    dummy.updateMatrix();
    butterflies.setMatrixAt(i, dummy.matrix);
    seeds[i] = Math.random();
  }
  bGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
  butterflies.instanceMatrix.needsUpdate = true;
}
butterflies.layers.set(LAYER_VOID);
scene.add(butterflies);

/* =========================================================
   THE OUTSIDE WORLD  (only NPC cameras see LAYER_OUTSIDE)
========================================================= */
const OUTSIDE_FOG = new THREE.Fog(0xc8d8e6, 700, 3400);

// skybox cubemap, downscaled + inlined so this stays a single file

   NPCs — dark void-people, faces made of a frustum window
========================================================= */
// void look = dark speckle; outside look = flat uTint (the screens see this)
function npcMaterial(tintR, tintG, tintB){
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uYellow: { value: 0 },
      uTint: { value: new THREE.Color(tintR, tintG, tintB) },
    },
    vertexShader: /* glsl */`
      varying vec3 vP;
      void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: GLSL_COMMON + /* glsl */`
      varying vec3 vP;
      uniform float uTime;
      uniform float uYellow;
      uniform vec3 uTint;
      void main(){
        vec3 d = normalize(vP);
        vec2 uv = vec2(atan(d.z, d.x) * 1.6, d.y * 2.6);
        vec2 g = uv * 9.0;
        vec2 id = floor(g);
        vec2 f = fract(g) - 0.5;
        float r = hash21(id * 1.7);
        float m = smoothstep(0.40, 0.08, length(f)) * step(0.35, r);
        float hue = fract(r * 3.0 + uTime * 0.03);
        float shim = 0.5 + 0.5 * sin(uTime * 2.0 + r * 40.0);
        vec3 dots = hsv2rgb(vec3(hue, 0.85, 1.0)) * m * (0.16 + 0.28 * shim);
        float rim = pow(1.0 - abs(d.z), 2.0) * 0.09;   // faint edge so the body has a silhouette

        vec3 voidCol = vec3(0.04, 0.04, 0.055) + dots + rim;
        vec3 tintCol = uTint * (0.80 + 0.20 * shim) + rim * 3.0;
        gl_FragColor = vec4(mix(voidCol, tintCol, uYellow), 1.0);
      }
    `,
  });
}

/* =========================================================
   GOD RAYS — the screen is a lit window; light pours out of
   it, but only the wedge inside the frustum cone is visible.
   a fake volumetric: an additive cone mesh (apex = eye, base
   past the screen) shaded to look like falling light shafts.
========================================================= */
const grParams = {
  enabled: true,
  intensity: 0.5,
  color: '#ffe6bf',
  reach: 1.0,        // 0 = light only at the window, 1 = out to the near (truncated) end
  edge: 0.6,         // 0 = hard cone wall, 1 = very soft
  window: 0.6,       // brightness bias toward the window
  down: 0.3,         // 0 = fills the whole cone, 1 = only pours downward
  fallHeight: 3.5,   // metres below the eye before the light dies out
  shaftScale: 3.0,   // density of the light/dust streaks
  shaftContrast: 0.7,
  fallSpeed: 0.5,    // streaks drifting downward
  tint: 0.3,         // 0 = flat colour, 1 = tinted by the screen image
};

function frustumConeGeo(){
  // TRUNCATED pyramid: a small rectangle near the eye -> full screen at the far end.
  // no apex, so the rays never pinch to a point. walls stay on the eye->screen cone.
  const bx = SCREEN_W / 2, by = SCREEN_H / 2, zf = -SCREEN_D * 0.985;
  const NEAR = 0.24;   // near end sits 24% of the way from eye to screen
  const far = [
    new THREE.Vector3(-bx, -by, zf), new THREE.Vector3(bx, -by, zf),
    new THREE.Vector3(bx,  by, zf), new THREE.Vector3(-bx,  by, zf),
  ];
  const near = far.map(v => v.clone().multiplyScalar(NEAR));
  const pts = [];
  for (let i = 0; i < 4; i++){                       // 4 side walls (quad -> 2 tris)
    const n = (i + 1) % 4;
    pts.push(near[i], far[i], far[n]);
    pts.push(near[i], far[n], near[n]);
  }
  pts.push(near[0], near[1], near[2], near[0], near[2], near[3]);   // near cap
  pts.push(far[0], far[2], far[1], far[0], far[3], far[2]);         // far cap
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  g.computeVertexNormals();
  return g;
}
const godrayGeo = frustumConeGeo();
const godrayMats = [];

function makeGodrayMat(mapTex){
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide,
    uniforms: {
      uTime: { value: 0 }, uIntensity: { value: 1.6 }, uColor: { value: new THREE.Color(grParams.color) },
      uReach: { value: 1 }, uEdge: { value: 0.6 }, uWindow: { value: 0.6 },
      uDown: { value: 0.3 }, uFallHeight: { value: 3.5 }, uShaftScale: { value: 3 }, uShaftContrast: { value: 0.7 },
      uFallSpeed: { value: 0.5 }, uTint: { value: 0.3 },
      uHalf: { value: new THREE.Vector2(SCREEN_W / 2, SCREEN_H / 2) }, uD: { value: SCREEN_D },
      uApexW: { value: new THREE.Vector3() }, uMap: { value: mapTex },
    },
    vertexShader: /* glsl */`
      varying vec3 vPos; varying vec3 vW; varying vec3 vN;
      void main(){
        vPos = position;
        vW = (modelMatrix * vec4(position, 1.0)).xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec3 vPos; varying vec3 vW; varying vec3 vN;
      uniform float uTime, uIntensity, uReach, uEdge, uWindow;
      uniform float uDown, uFallHeight, uShaftScale, uShaftContrast, uFallSpeed, uTint, uD;
      uniform vec3 uColor, uApexW; uniform vec2 uHalf; uniform sampler2D uMap;

      float hash(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
      float vnoise(vec2 p){
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
                   mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
      }

      void main(){
        float s = -vPos.z / uD;                       // 0 at the eye, 1 at the screen plane
        if (s <= 0.002) discard;

        // thickness through the volume: a back face pointing at the camera = looking
        // through lots of cone; a grazing side wall = thin. bright core, soft rim.
        vec3 viewDir = normalize(cameraPosition - vW);
        float body = pow(clamp(abs(dot(viewDir, normalize(vN))), 0.0, 1.0), mix(3.5, 0.4, uEdge));

        // lit span runs back from the window (s=1) toward the eye by uReach
        float s0 = 1.0 - uReach;
        float axial = smoothstep(s0, s0 + 0.18, s) * (1.0 - smoothstep(0.985, 1.02, s));
        // bias brightness toward the window
        float window = mix(1.0, s, uWindow);

        // falling light shafts: plain vertical streaks in world space — no swirl,
        // no centre point (keyed to world x/z so they read like sun through a window)
        float fall   = dot(vW - uApexW, vec3(0.0, -1.0, 0.0));   // metres below the eye
        float across = dot(vW, vec3(0.9, 0.0, 0.44)) * uShaftScale;
        float ph = fall * uShaftScale - uTime * uFallSpeed * 2.5;
        float shaft = vnoise(vec2(across, ph)) * 0.6 + vnoise(vec2(across * 2.2 + 5.0, ph * 2.1 + 7.0)) * 0.4;
        shaft = pow(clamp(shaft + 0.2, 0.0, 1.0), 1.5);
        shaft = mix(1.0, shaft, uShaftContrast);

        // pour downward: full below the eye, fading above it (uDown = how strict)
        float down = mix(1.0, smoothstep(uApexW.y + 0.8, uApexW.y - uFallHeight, vW.y), uDown);

        vec3 col = uColor;
        if (uTint > 0.002){
          vec2 uv = clamp(vPos.xy / (uHalf * max(s, 0.002)) * 0.5 + 0.5, 0.0, 1.0);
          col = mix(col, texture2D(uMap, uv).rgb + 0.12, uTint);
        }

        float a = body * axial * window * shaft * down * uIntensity * 1.6;
        gl_FragColor = vec4(col * max(a, 0.0), 1.0);
      }
    `,
  });
  godrayMats.push(m);
  fx.push(m);
  return m;
}

const _p = new THREE.Vector3(), _q = new THREE.Quaternion();
const _v = new THREE.Vector3(), _p2 = new THREE.Vector3(), _p3 = new THREE.Vector3();

function makeNPC(cfg){
  const group = new THREE.Group();

  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.36, 6, 12), npcMat);
  body.position.y = 1.14;   // ends around the hip so the legs actually show
  group.add(body);

  // a shirt: a slightly proud band over the torso — dark like the body in the void, red outside
  const shirt = new THREE.Mesh(new THREE.CapsuleGeometry(0.272, 0.34, 6, 12), shirtMat);
  shirt.position.y = 1.08;
  group.add(shirt);

  const legGeo = new THREE.CapsuleGeometry(0.085, 0.42, 4, 8);   // shorter — top stays under the shorts
  const armGeo = new THREE.CapsuleGeometry(0.085, 0.55, 4, 8);
  const legL = new THREE.Mesh(legGeo, npcMat); legL.position.set(0.12, 0.435, 0);
  const legR = new THREE.Mesh(legGeo, npcMat); legR.position.set(-0.12, 0.435, 0);
  const armL = new THREE.Mesh(armGeo, npcMat); armL.position.set(0.34, 1.24, 0); armL.scale.setScalar(0.82);
  const armR = new THREE.Mesh(armGeo, npcMat); armR.position.set(-0.34, 1.24, 0); armR.scale.setScalar(0.82);
  group.add(legL, legR, armL, armR);

  // below-knee jean shorts: one cylinder per leg, a bit fatter than the leg
  // (dark like the body in the void, denim blue in the outside view)
  for (const leg of [legL, legR]){
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, 0.45, 12), shortsMat);
    cuff.position.y = 0.17;   // leg-local: tops tuck under the body, hem sits below the knee
    leg.add(cuff);
  }

  const headPivot = new THREE.Group();
  headPivot.position.set(0, 1.62, 0);
  group.add(headPivot);

  headPivot.add(new THREE.Mesh(new THREE.SphereGeometry(0.23, 20, 16), npcMat));

  // the floating eyes from the painting
  const eyeGeo = new THREE.SphereGeometry(0.052, 12, 10);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x9ec8ff, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false });
  // eyes sit on the same side the frustum looks out of (local -Z), so the
  // screen reads as sprouting from the face, not the back of the head
  for (const sx of [1, -1]){
    const e = new THREE.Mesh(eyeGeo, eyeMat);
    e.position.set(0.085 * sx, 0.03, -0.2);
    headPivot.add(e);
    const gl = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), glowMat);
    gl.position.copy(e.position);
    headPivot.add(gl);
  }

  // the frustum "screen" — the only window onto outside
  const d = SCREEN_D, h = SCREEN_H, w = SCREEN_W;
  const rt = new THREE.WebGLRenderTarget(RT_W, RT_H, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  rt.texture.colorSpace = THREE.SRGBColorSpace;

  // the image only exists on the side the eyes look through; the far side is a blank panel
  const screenGeo = new THREE.PlaneGeometry(w, h);
  const screen = new THREE.Mesh(
    screenGeo,
    new THREE.MeshBasicMaterial({ map: rt.texture, toneMapped: false, side: THREE.FrontSide })
  );
  screen.position.set(0, 0, -d);
  screen.renderOrder = 2;
  headPivot.add(screen);

  const screenBack = new THREE.Mesh(
    screenGeo,
    new THREE.MeshBasicMaterial({ color: 0x0a0a10, side: THREE.BackSide })
  );
  screenBack.position.set(0, 0, -d);
  screenBack.renderOrder = 2;
  headPivot.add(screenBack);

  const bx = w / 2, by = h / 2;
  const border = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-bx, -by, -d), new THREE.Vector3(bx, -by, -d),
      new THREE.Vector3(bx, by, -d), new THREE.Vector3(-bx, by, -d),
    ]),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
  );
  border.renderOrder = 3;
  headPivot.add(border);

  const fp = [];
  [[-bx, -by], [bx, -by], [bx, by], [-bx, by]].forEach(([x, y]) => {
    fp.push(new THREE.Vector3(0, 0, 0), new THREE.Vector3(x, y, -d));
  });
  const frustum = new THREE.LineSegments(
    new THREE.BufferGeometry().setFromPoints(fp),
    new THREE.LineBasicMaterial({ color: 0x8fd0ff, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  frustum.renderOrder = 3;
  headPivot.add(frustum);

  // god rays: additive cone filling the frustum between the eye and the screen
  const godray = new THREE.Mesh(godrayGeo, makeGodrayMat(rt.texture));
  godray.renderOrder = 4;
  godray.frustumCulled = false;
  headPivot.add(godray);

  const cam = new THREE.PerspectiveCamera(NPC_FOV, RT_ASPECT, 0.1, 6000);
  cam.layers.enable(LAYER_OUTSIDE);   // ...on top of the figures on layer 0

  // the frustum apparatus is void-only, so screens never nest inside screens
  for (const o of [screen, screenBack, border, frustum, godray]) o.layers.set(LAYER_VOID);

  scene.add(group);
  return { ...cfg, group, headPivot, legL, legR, armL, armR, cam, rt, screen, screenBack, border, frustum, godray };
}

const npcConfigs = [
  { cx: 0,  cz: 0,  rx: 4.5, rz: 3.0, speed: 0.28, phase: 0.0, dir: 1,  stride: 5.5 },
  { cx: 2,  cz: 1,  rx: 6.5, rz: 5.0, speed: 0.19, phase: 1.7, dir: -1, stride: 5.0 },
  { cx: -3, cz: -2, rx: 3.2, rz: 4.4, speed: 0.34, phase: 3.1, dir: 1,  stride: 6.2 },
  { cx: 1,  cz: -3, rx: 7.0, rz: 2.6, speed: 0.16, phase: 4.6, dir: 1,  stride: 4.6 },
  { cx: -1, cz: 3,  rx: 2.6, rz: 5.6, speed: 0.24, phase: 5.9, dir: -1, stride: 5.8 },
];
const npcs = npcConfigs.map(makeNPC);

/* =========================================================
   POV TRAIL — freeze one NPC's window as it moves, so its
   POV "video" sweeps a translucent volume through the void
========================================================= */
const TRAIL_NPC = 0;
const TRAIL_N = 48;
// place ghosts a hair toward the eye from the live screen, so the newest one
// doesn't z-fight the opaque screen plane
const TRAIL_OFFSET = new THREE.Matrix4().makeTranslation(0, 0, -(SCREEN_D - 0.03));
const trail = {
  enabled: true, mode: 'ribbon', opacity: 0.6, falloff: 1.0, kernel: 1.8, additive: true,
  head: 0, count: 0, lastT: -1e3,
  lastPos: new THREE.Vector3(1e9, 1e9, 1e9), lastQuat: new THREE.Quaternion(),
};
const trailCam = new THREE.PerspectiveCamera(NPC_FOV, RT_ASPECT, 0.1, 6000);
trailCam.layers.enable(LAYER_OUTSIDE);
const trailGroup = new THREE.Group();
trailGroup.visible = false;
scene.add(trailGroup);

// one atlas render target: TRAIL_COLS x TRAIL_ROWS cells, one cell per captured frame
const TRAIL_COLS = 8, TRAIL_ROWS = 6, TRAIL_CW = 256, TRAIL_CH = 192;
const trailAtlas = new THREE.WebGLRenderTarget(TRAIL_COLS * TRAIL_CW, TRAIL_ROWS * TRAIL_CH, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
});
trailAtlas.texture.colorSpace = THREE.SRGBColorSpace;
trailAtlas.texture.generateMipmaps = false;

const TRAIL_GLSL = /* glsl */`
  uniform sampler2D uAtlas;
  uniform float uOpacity, uFalloff;
  vec2 atlasUv(float cell, vec2 uv){
    float col = mod(cell, ${TRAIL_COLS}.0);
    float row = floor(cell / ${TRAIL_COLS}.0);
    return (vec2(col, row) + clamp(uv, 0.003, 0.997)) / vec2(${TRAIL_COLS}.0, ${TRAIL_ROWS}.0);
  }
`;

// per captured frame: baked world matrix + capture index (its atlas cell = ring slot)
const trailRings = [];
for (let i = 0; i < TRAIL_N; i++) trailRings.push({ matrix: new THREE.Matrix4(), index: -1 });

// --- FRAMES mode: a soft-edged quad per captured frame --------------------
const trailQuadGeo = new THREE.PlaneGeometry(SCREEN_W, SCREEN_H);
const trailFrames = [];
for (let i = 0; i < TRAIL_N; i++){
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.NormalBlending, side: THREE.DoubleSide,
    uniforms: { uAtlas: { value: trailAtlas.texture }, uOpacity: { value: 0 }, uFalloff: { value: 2 },
                uCell: { value: i }, uAge: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: TRAIL_GLSL + `
      varying vec2 vUv; uniform float uCell, uAge;
      void main(){
        vec3 c = texture2D(uAtlas, atlasUv(uCell, vUv)).rgb;
        float m = max(abs(vUv.x - 0.5), abs(vUv.y - 0.5));
        gl_FragColor = vec4(c, uOpacity * pow(1.0 - clamp(uAge, 0.0, 1.0), uFalloff) * smoothstep(0.5, 0.32, m));
      }`,
  });
  const mesh = new THREE.Mesh(trailQuadGeo, mat);
  mesh.matrixAutoUpdate = false; mesh.frustumCulled = false; mesh.visible = false;
  mesh.layers.set(LAYER_VOID);
  trailGroup.add(mesh);
  trailFrames.push({ mat, mesh });
}

// --- RIBBON mode: one lofted tube swept by the window's 4 corners ---------
const TRAIL_HW = SCREEN_W / 2, TRAIL_HH = SCREEN_H / 2;
const TRAIL_CORNER = [
  new THREE.Vector3(-TRAIL_HW,  TRAIL_HH, 0), new THREE.Vector3( TRAIL_HW,  TRAIL_HH, 0),
  new THREE.Vector3( TRAIL_HW, -TRAIL_HH, 0), new THREE.Vector3(-TRAIL_HW, -TRAIL_HH, 0),
];
const TRAIL_CUV = [[0, 1], [1, 1], [1, 0], [0, 0]];
const TRAIL_INWARD = [[0, -1], [-1, 0], [0, 1], [1, 0]];
const TRAIL_BAND = 0.22;
const TRAIL_MAXV = (TRAIL_N - 1) * 4 * 6;
const rbPos = new THREE.Float32BufferAttribute(new Float32Array(TRAIL_MAXV * 3), 3).setUsage(THREE.DynamicDrawUsage);
const rbC = [0, 1, 2, 3].map(() => new THREE.Float32BufferAttribute(new Float32Array(TRAIL_MAXV), 1).setUsage(THREE.DynamicDrawUsage));
const rbBlend = new THREE.Float32BufferAttribute(new Float32Array(TRAIL_MAXV), 1).setUsage(THREE.DynamicDrawUsage);
const rbAge = new THREE.Float32BufferAttribute(new Float32Array(TRAIL_MAXV), 1).setUsage(THREE.DynamicDrawUsage);
const rbBand = new THREE.Float32BufferAttribute(new Float32Array(TRAIL_MAXV * 2), 2).setUsage(THREE.DynamicDrawUsage);
const ribbonGeo = new THREE.BufferGeometry();
ribbonGeo.setAttribute('position', rbPos);
rbC.forEach((a, i) => ribbonGeo.setAttribute('aC' + i, a));
ribbonGeo.setAttribute('aBlend', rbBlend);
ribbonGeo.setAttribute('aAge', rbAge);
ribbonGeo.setAttribute('aBand', rbBand);
ribbonGeo.setDrawRange(0, 0);
const ribbonMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.NormalBlending, side: THREE.DoubleSide,
  uniforms: { uAtlas: { value: trailAtlas.texture }, uOpacity: { value: 0.14 }, uFalloff: { value: 2 }, uKernel: { value: 1.8 } },
  vertexShader: `
    attribute float aC0, aC1, aC2, aC3, aBlend, aAge; attribute vec2 aBand;
    varying float vC0, vC1, vC2, vC3, vBlend, vAge; varying vec2 vBand;
    void main(){ vC0 = aC0; vC1 = aC1; vC2 = aC2; vC3 = aC3; vBlend = aBlend; vAge = aAge; vBand = aBand;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: TRAIL_GLSL + `
    varying float vC0, vC1, vC2, vC3, vBlend, vAge; varying vec2 vBand;
    uniform float uKernel;
    float kern(float x){
      float d = abs(x) / max(uKernel, 0.001);
      return d >= 1.0 ? 0.0 : 0.5 + 0.5 * cos(3.14159265 * d);
    }
    void main(){
      // 4-tap cosine window over prev / A / B / next captured frames -> smooth flow
      float f = vBlend;                     // 0 at frame A, 1 at frame B; prev is -1, next is 2
      float w0 = kern(-1.0 - f), w1 = kern(-f), w2 = kern(1.0 - f), w3 = kern(2.0 - f);
      float ws = w0 + w1 + w2 + w3;
      vec3 c = (
        texture2D(uAtlas, atlasUv(vC0, vBand)).rgb * w0 +
        texture2D(uAtlas, atlasUv(vC1, vBand)).rgb * w1 +
        texture2D(uAtlas, atlasUv(vC2, vBand)).rgb * w2 +
        texture2D(uAtlas, atlasUv(vC3, vBand)).rgb * w3
      ) / max(ws, 0.001);
      gl_FragColor = vec4(c, uOpacity * pow(1.0 - clamp(vAge, 0.0, 1.0), uFalloff));
    }`,
});
const ribbonMesh = new THREE.Mesh(ribbonGeo, ribbonMat);
ribbonMesh.frustumCulled = false; ribbonMesh.visible = false;
ribbonMesh.layers.set(LAYER_VOID);
trailGroup.add(ribbonMesh);

const _ringSeq = [];
const _cA = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
const _cB = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];

function rebuildRibbon(){
  _ringSeq.length = 0;
  for (let i = 0; i < TRAIL_N; i++) if (trailRings[i].index >= 0) _ringSeq.push(i);
  _ringSeq.sort((a, b) => trailRings[a].index - trailRings[b].index);
  const newest = trail.count - 1;
  const P = rbPos.array, C0 = rbC[0].array, C1 = rbC[1].array, C2 = rbC[2].array, C3 = rbC[3].array, BL = rbBlend.array, G = rbAge.array, B = rbBand.array;
  const last = _ringSeq.length - 1;
  let w = 0;
  const put = (v, c0, c1, c2, c3, blend, age, bu, bv) => {
    P[w*3] = v.x; P[w*3+1] = v.y; P[w*3+2] = v.z;
    C0[w] = c0; C1[w] = c1; C2[w] = c2; C3[w] = c3; BL[w] = blend; G[w] = age; B[w*2] = bu; B[w*2+1] = bv; w++;
  };
  const bw = TRAIL_BAND * 0.5;   // sample a thin fixed slice — the blur is the 4-tap window
  for (let s = 0; s < last; s++){
    const ia = _ringSeq[s], ib = _ringSeq[s + 1];
    const c0 = _ringSeq[Math.max(0, s - 1)], c3 = _ringSeq[Math.min(last, s + 2)];
    const ra = trailRings[ia], rb = trailRings[ib];
    const ageA = (newest - ra.index) / TRAIL_N, ageB = (newest - rb.index) / TRAIL_N;
    for (let k = 0; k < 4; k++){
      _cA[k].copy(TRAIL_CORNER[k]).applyMatrix4(ra.matrix);
      _cB[k].copy(TRAIL_CORNER[k]).applyMatrix4(rb.matrix);
    }
    for (let e = 0; e < 4; e++){
      const p = e, q = (e + 1) % 4;
      const uP = TRAIL_CUV[p], uQ = TRAIL_CUV[q], iw = TRAIL_INWARD[e];
      const bpx = uP[0] + iw[0] * bw, bpy = uP[1] + iw[1] * bw;
      const bqx = uQ[0] + iw[0] * bw, bqy = uQ[1] + iw[1] * bw;
      // quad A_p A_q B_q B_p: the 4 window cells are constant, blend 0 on the A side, 1 on the B side
      put(_cA[p], c0, ia, ib, c3, 0, ageA, bpx, bpy);
      put(_cA[q], c0, ia, ib, c3, 0, ageA, bqx, bqy);
      put(_cB[q], c0, ia, ib, c3, 1, ageB, bqx, bqy);
      put(_cA[p], c0, ia, ib, c3, 0, ageA, bpx, bpy);
      put(_cB[q], c0, ia, ib, c3, 1, ageB, bqx, bqy);
      put(_cB[p], c0, ia, ib, c3, 1, ageB, bpx, bpy);
    }
  }
  ribbonGeo.setDrawRange(0, w);
  rbPos.needsUpdate = rbBlend.needsUpdate = rbAge.needsUpdate = rbBand.needsUpdate = true;
  for (const a of rbC) a.needsUpdate = true;
}

function resetTrail(){
  trail.head = 0; trail.count = 0; trail.lastT = -1e3;
  trail.lastPos.set(1e9, 1e9, 1e9);
  for (const r of trailRings) r.index = -1;
  for (const f of trailFrames) f.mesh.visible = false;
  ribbonGeo.setDrawRange(0, 0);
}

const _grCol = new THREE.Color();
function syncGodrays(){
  _grCol.set(grParams.color);
  for (const m of godrayMats){
    const u = m.uniforms;
    u.uIntensity.value = grParams.intensity;
    u.uColor.value.copy(_grCol);
    u.uReach.value = grParams.reach;
    u.uWindow.value = grParams.window;
    u.uEdge.value = grParams.edge;
    u.uDown.value = grParams.down;
    u.uFallHeight.value = grParams.fallHeight;
    u.uShaftScale.value = grParams.shaftScale;
    u.uShaftContrast.value = grParams.shaftContrast;
    u.uFallSpeed.value = grParams.fallSpeed;
    u.uTint.value = grParams.tint;
  }
  for (const u of npcs) u.godray.visible = grParams.enabled;
}

function updateNPC(u, t){
  const a = u.phase + t * u.speed * u.dir;
  const x = u.cx + Math.cos(a) * u.rx;
  const z = u.cz + Math.sin(a) * u.rz;
  const vx = -Math.sin(a) * u.rx * u.speed * u.dir;
  const vz =  Math.cos(a) * u.rz * u.speed * u.dir;
  u.group.position.set(x, Math.sin(t * u.stride) * 0.05, z);
  u.group.rotation.y = Math.atan2(vx, vz) + Math.PI;   // face (-Z, the frustum side) along travel

  const sw = Math.sin(t * u.stride);
  u.legL.rotation.x =  sw * 0.5;  u.legR.rotation.x = -sw * 0.5;
  u.armL.rotation.x = -sw * 0.42; u.armR.rotation.x =  sw * 0.42;

  // looking around — layered so it never settles into a loop
  u.headPivot.rotation.y = Math.sin(t * 0.55 + u.phase) * 0.6 + Math.sin(t * 0.21 + u.phase * 2.0) * 0.35;
  u.headPivot.rotation.x = Math.sin(t * 0.47 + u.phase) * 0.16 - 0.03;
}

/* =========================================================

let povIndex = -1;

const bB = document.getElementById('b-butter');
bB.onclick = () => { butterflies.visible = !butterflies.visible; bB.classList.toggle('on', butterflies.visible); };

let tween = null;
function flyTo(pos, tgt){
  tween = { t: 0, fromP: camera.position.clone(), toP: pos.clone(), fromT: controls.target.clone(), toT: tgt.clone() };
}
function updateTween(dt){
  if (!tween) return;
  tween.t = Math.min(1, tween.t + dt / 0.9);
  const k = 1 - Math.pow(1 - tween.t, 3);
  camera.position.lerpVectors(tween.fromP, tween.toP, k);
  controls.target.lerpVectors(tween.fromT, tween.toT, k);
  if (tween.t >= 1) tween = null;
}

function exitPOV(){
  povIndex = -1;
  controls.enabled = true;
  flyTo(new THREE.Vector3(0, 3.4, 14), new THREE.Vector3(0, 1.5, 0));
}

function enterPOV(i){
  povIndex = i;
  controls.enabled = false;
  // one snappy fly-in; the loop keeps the shot glued after that
  const u = npcs[i];
  u.headPivot.getWorldPosition(_p);
  u.headPivot.getWorldQuaternion(_q);
  const fwd = _v.set(0, 0, -1).applyQuaternion(_q);
  flyTo(_p.clone().addScaledVector(fwd, -2.6).add(new THREE.Vector3(0, 0.9, 0)),
        _p.clone().addScaledVector(fwd, 6.0));
}

// click the image side of a screen to ride that NPC's POV (Esc to leave)
const raycaster = new THREE.Raycaster();
raycaster.layers.set(LAYER_VOID);               // the screens live on LAYER_VOID
const ndc = new THREE.Vector2();
const screenMeshes = npcs.map(u => u.screen);   // FrontSide only -> the blank back never picks
let downX = 0, downY = 0;

function pickScreen(ev){
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(screenMeshes, false)[0];
  return hit ? screenMeshes.indexOf(hit.object) : -1;
}

renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return;   // that was an orbit drag
  const i = pickScreen(e);
  if (i >= 0) enterPOV(i);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) return;
  renderer.domElement.style.cursor = pickScreen(e) >= 0 ? 'pointer' : '';
});
addEventListener('keydown', e => {
  if (e.key === 'Escape' && povIndex >= 0) exitPOV();
});

/* =========================================================
   LOOP
========================================================= */
const clock = new THREE.Clock();

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const m of fx) m.uniforms.uTime.value = t;

  shell.position.copy(camera.position);
  shell.rotation.y = t * 0.01;
  for (const b of bokeh){ b.quaternion.copy(camera.quaternion); b.rotation.z += b.userData.spin * dt; }

  for (const u of npcs){
    updateNPC(u, t);
    u.headPivot.getWorldPosition(u.godray.material.uniforms.uApexW.value);
  }
  syncGodrays();

  // 1 — paint each NPC's POV: the valley + the OTHER figures, flipped to their outside colours
  scene.background = sky;
  scene.fog = OUTSIDE_FOG;
  for (const m of npcMats) m.uniforms.uYellow.value = 1;
  for (const u of npcs){
    u.headPivot.getWorldPosition(_p);
    u.headPivot.getWorldQuaternion(_q);
    u.cam.position.copy(_p).multiplyScalar(WORLD_PARALLAX);
    u.cam.quaternion.copy(_q);
    u.group.visible = false;              // an NPC never films itself
    renderer.setRenderTarget(u.rt);
    renderer.render(scene, u.cam);
    u.group.visible = true;
  }

  // 1b — POV trail: freeze one NPC's window when it has moved/turned enough
  if (trail.enabled){
    const u = npcs[TRAIL_NPC];
    u.headPivot.getWorldPosition(_p);
    u.headPivot.getWorldQuaternion(_q);
    const dt2 = t - trail.lastT;
    if (dt2 > 0.1 && (_p.distanceTo(trail.lastPos) > 0.045 || _q.angleTo(trail.lastQuat) > 0.0125 || dt2 > 0.4)){
      trail.lastPos.copy(_p); trail.lastQuat.copy(_q); trail.lastT = t;
      const i = trail.head;
      const col = i % TRAIL_COLS, row = (i / TRAIL_COLS) | 0;
      trailAtlas.viewport.set(col * TRAIL_CW, row * TRAIL_CH, TRAIL_CW, TRAIL_CH);
      trailAtlas.scissor.set(col * TRAIL_CW, row * TRAIL_CH, TRAIL_CW, TRAIL_CH);
      trailAtlas.scissorTest = true;
      trailCam.position.copy(_p); trailCam.quaternion.copy(_q);
      u.group.visible = false;
      renderer.setRenderTarget(trailAtlas);
      renderer.render(scene, trailCam);
      u.group.visible = true;
      const r = trailRings[i];
      r.matrix.copy(u.headPivot.matrixWorld).multiply(TRAIL_OFFSET);
      r.index = trail.count;
      const fm = trailFrames[i].mesh;
      fm.matrix.copy(r.matrix); fm.matrixWorld.copy(r.matrix);
      trail.count++;
      trail.head = (trail.head + 1) % TRAIL_N;
    }
  }
  renderer.setRenderTarget(null);

  // 2 — glue the camera behind the chosen NPC, if any
  if (povIndex >= 0 && !tween){
    const u = npcs[povIndex];
    u.headPivot.getWorldPosition(_p);
    u.headPivot.getWorldQuaternion(_q);
    const fwd = _v.set(0, 0, -1).applyQuaternion(_q);
    _p2.copy(_p).addScaledVector(fwd, -2.6); _p2.y += 0.9;
    _p3.copy(_p).addScaledVector(fwd, 6.0);
    const s = 1 - Math.pow(0.0015, dt);
    camera.position.lerp(_p2, s);
    controls.target.lerp(_p3, s);
  }

  updateTween(dt);
  controls.update();

  // POV trail: pick the mode, keep the comet fade current
  if (trail.enabled){
    trailGroup.visible = true;
    const useRibbon = trail.mode === 'ribbon';
    ribbonMesh.visible = useRibbon;
    if (useRibbon){
      rebuildRibbon();
      ribbonMat.uniforms.uOpacity.value = trail.opacity;
      ribbonMat.uniforms.uFalloff.value = trail.falloff;
      ribbonMat.uniforms.uKernel.value = trail.kernel;
      for (const f of trailFrames) f.mesh.visible = false;
    } else {
      for (let i = 0; i < TRAIL_N; i++){
        const f = trailFrames[i], r = trailRings[i];
        const age = trail.count - 1 - r.index;
        if (r.index < 0 || age < 0 || age >= TRAIL_N){ f.mesh.visible = false; continue; }
        f.mesh.visible = true;
        f.mat.uniforms.uOpacity.value = trail.opacity;
        f.mat.uniforms.uFalloff.value = trail.falloff;
        f.mat.uniforms.uAge.value = age / TRAIL_N;
      }
    }
  } else if (trailGroup.visible){
    trailGroup.visible = false;
  }

  // 3 — the void
  scene.background = VOID_BG;
  scene.fog = null;
  for (const m of npcMats) m.uniforms.uYellow.value = 0;
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

frame();

// safety: if the skybox 404s, don't sit on the loader forever
setTimeout(() => document.getElementById('load').classList.add('gone'), 6000);
</script>
</body>
</html>
