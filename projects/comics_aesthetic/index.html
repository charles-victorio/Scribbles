<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INK PRESS — comic render test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:      #14100f;   /* press black, warm */
    --plate:    #1d1917;   /* panel body */
    --paper:    #ece4d6;   /* newsprint */
    --cyan:     #00a3c4;
    --magenta:  #d6006e;
    --yellow:   #f5c400;
    --rule:     rgba(236,228,214,0.16);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- stage ---------- */
  #stage{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%; touch-action:none;}

  /* registration crosshairs — the printer's alignment marks */
  .reg{position:fixed; width:26px; height:26px; pointer-events:none; opacity:.5; z-index:3;}
  .reg::before,.reg::after{content:""; position:absolute; background:var(--paper);}
  .reg::before{left:50%; top:0; width:1px; height:100%; transform:translateX(-50%);}
  .reg::after{top:50%; left:0; height:1px; width:100%; transform:translateY(-50%);}
  .reg.tl{top:14px; left:14px;} .reg.tr{top:14px; right:14px;}
  .reg.bl{bottom:130px; left:14px;} .reg.br{bottom:130px; right:14px;}

  /* ---------- masthead ---------- */
  #head{position:fixed; top:44px; left:44px; z-index:4; pointer-events:none; mix-blend-mode:difference;}
  #head h1{
    font-family:"Anton", Impact, sans-serif;
    font-size:clamp(30px,4.6vw,58px);
    line-height:.86; letter-spacing:-.02em; margin:0;
    text-transform:uppercase;
  }
  #head p{margin:8px 0 0; font-size:10px; letter-spacing:.22em; text-transform:uppercase; opacity:.7;}

  /* ---------- control plate ---------- */
  #plate{
    position:fixed; top:44px; right:44px; width:264px; z-index:5;
    background:var(--plate);
    border:1px solid var(--rule);
    max-height:calc(100vh - 200px);
    overflow-y:auto;
  }
  #plate::-webkit-scrollbar{width:6px;}
  #plate::-webkit-scrollbar-thumb{background:var(--rule);}

  /* the CMYK control strip a press operator reads to check ink density */
  #strip{display:flex; height:7px;}
  #strip i{flex:1;}

  .grp{border-bottom:1px solid var(--rule); padding:14px 16px 16px;}
  .grp:last-child{border-bottom:0;}
  .grp > h2{
    margin:0 0 12px; font-size:9px; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase; opacity:.5;
    display:flex; justify-content:space-between; align-items:center;
  }
  .swatch{width:8px; height:8px; border-radius:50%;}

  .row{margin-bottom:11px;}
  .row:last-child{margin-bottom:0;}
  .row label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10px; letter-spacing:.06em; margin-bottom:5px; text-transform:uppercase;
  }
  .row label b{font-weight:500; opacity:.75;}
  .row label span{font-variant-numeric:tabular-nums; font-size:11px; opacity:.95;}

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:14px; background:transparent; cursor:ew-resize; display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--rule);}
  input[type=range]::-moz-range-track{height:2px; background:var(--rule);}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:3px; height:14px; margin-top:-6px;
    background:var(--paper); border:0; border-radius:0;
  }
  input[type=range]::-moz-range-thumb{width:3px; height:14px; background:var(--paper); border:0; border-radius:0;}
  input[type=range]:focus-visible{outline:1px solid var(--yellow); outline-offset:3px;}

  .tog{
    display:flex; align-items:center; gap:9px; width:100%;
    background:none; border:0; padding:5px 0; margin:0;
    color:inherit; font:inherit; font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer; text-align:left;
  }
  .tog i{
    width:20px; height:10px; border:1px solid var(--rule); flex:none; position:relative;
  }
  .tog i::after{
    content:""; position:absolute; inset:1px; width:6px; background:var(--rule);
    transition:transform .12s steps(2);
  }
  .tog[aria-pressed=true] i::after{background:var(--yellow); transform:translateX(10px);}
  .tog[aria-pressed=true]{opacity:1;}
  .tog:not([aria-pressed=true]){opacity:.55;}
  .tog:focus-visible{outline:1px solid var(--yellow); outline-offset:2px;}

  .btn{
    display:block; width:100%; padding:9px; margin-top:8px;
    background:var(--paper); color:var(--ink); border:0;
    font:inherit; font-size:10px; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; cursor:pointer;
  }
  .btn:active{transform:translateY(1px);}
  .btn.ghost{background:none; color:var(--paper); border:1px solid var(--rule); font-weight:400;}
  .btn:focus-visible{outline:1px solid var(--yellow); outline-offset:2px;}
  .hint{margin:10px 0 0; font-size:9px; line-height:1.6; opacity:.42; letter-spacing:.04em;}

  /* ---------- panel strip ---------- */
  #strip-wrap{
    position:fixed; left:0; right:0; bottom:0; height:118px; z-index:6;
    background:linear-gradient(to top, rgba(20,16,15,.94), rgba(20,16,15,0));
    display:flex; align-items:flex-end; gap:14px;
    padding:0 44px 16px; overflow-x:auto; overflow-y:hidden;
  }
  #strip-wrap::-webkit-scrollbar{height:0;}
  .panel{
    flex:none; width:120px; padding:0; border:0; background:none; cursor:pointer;
    filter:drop-shadow(3px 4px 0 rgba(0,0,0,.55));
  }
  .panel img{
    display:block; width:100%; height:74px; object-fit:cover;
    border:2px solid var(--ink); background:var(--paper);
  }
  .panel figcaption{
    font-size:8px; letter-spacing:.1em; opacity:.55; padding-top:5px;
    display:flex; justify-content:space-between; text-transform:uppercase;
  }
  .panel:hover img, .panel:focus-visible img{border-color:var(--yellow);}
  .panel:focus-visible{outline:none;}
  #empty{
    font-size:9px; letter-spacing:.18em; text-transform:uppercase; opacity:.35;
    padding-bottom:30px;
  }

  @media (max-width:820px){
    #plate{top:auto; bottom:134px; right:12px; left:12px; width:auto; max-height:44vh;}
    #head{top:20px; left:20px;}
    .reg{display:none;}
    #strip-wrap{padding:0 16px 14px;}
  }
  @media (prefers-reduced-motion:reduce){
    .tog i::after{transition:none;}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div class="reg tl"></div><div class="reg tr"></div>
<div class="reg bl"></div><div class="reg br"></div>

<header id="head">
  <h1>Ink<br>Press</h1>
  <p>Screen-space comic pass · test plate 01</p>
</header>

<section id="plate" aria-label="Render controls">
  <div id="strip">
    <i style="background:var(--cyan)"></i>
    <i style="background:var(--magenta)"></i>
    <i style="background:var(--yellow)"></i>
    <i style="background:var(--ink)"></i>
  </div>

  <div class="grp">
    <h2>Halftone <span class="swatch" style="background:var(--magenta)"></span></h2>
    <div class="row">
      <label for="htMix"><b>Ink coverage</b><span id="htMixV"></span></label>
      <input id="htMix" type="range" min="0" max="1" step="0.01" value="0.85">
    </div>
    <div class="row">
      <label for="htSize"><b>Dot pitch</b><span id="htSizeV"></span></label>
      <input id="htSize" type="range" min="2" max="14" step="0.5" value="5">
    </div>
    <button class="tog" id="togPlates" aria-pressed="true"><i></i>Split C/M/Y plates</button>
  </div>

  <div class="grp">
    <h2>Line work <span class="swatch" style="background:var(--paper)"></span></h2>
    <div class="row">
      <label for="edge"><b>Edge weight</b><span id="edgeV"></span></label>
      <input id="edge" type="range" min="0" max="2" step="0.02" value="1">
    </div>
    <div class="row">
      <label for="thick"><b>Line width</b><span id="thickV"></span></label>
      <input id="thick" type="range" min="0.5" max="4" step="0.1" value="1.4">
    </div>
    <button class="tog" id="togBoil" aria-pressed="true"><i></i>Boil on twos (12 fps)</button>
  </div>

  <div class="grp">
    <h2>Press faults <span class="swatch" style="background:var(--cyan)"></span></h2>
    <div class="row">
      <label for="mis"><b>Misregistration</b><span id="misV"></span></label>
      <input id="mis" type="range" min="0" max="6" step="0.1" value="2">
    </div>
    <div class="row">
      <label for="grain"><b>Paper tooth</b><span id="grainV"></span></label>
      <input id="grain" type="range" min="0" max="1" step="0.01" value="0.35">
    </div>
  </div>

  <div class="grp">
    <button class="tog" id="togRaw" aria-pressed="false"><i></i>Bypass — show raw 3D</button>
    <button class="tog" id="togSpin" aria-pressed="true"><i></i>Auto orbit</button>
    <button class="btn" id="shoot">Take panel</button>
    <button class="btn ghost" id="clear">Clear strip</button>
    <p class="hint">Drag to orbit · scroll to zoom · space takes a panel · click a panel to jump the camera back to that moment.</p>
  </div>
</section>

<div id="strip-wrap" aria-label="Captured panels"><span id="empty">Strip empty — take a panel</span></div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------------
   RENDERER
--------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f0e7d8');

const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 60);
camera.position.set(6.4, 3.6, 7.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 22;
controls.target.set(0, 0.9, 0);

/* ---------------------------------------------------------------
   BANDED SHADING
   MeshToonMaterial + a 3-step nearest-filtered gradient map is the
   cheapest honest way to get hard terminator lines.
--------------------------------------------------------------- */
function rampTexture(steps) {
  const tex = new THREE.DataTexture(new Uint8Array(steps), steps.length, 1, THREE.RedFormat);
  tex.minFilter = tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}
const ramp = rampTexture([70, 165, 255]);

const INK = {
  red:    '#e2352b',
  blue:   '#1b57b8',
  yellow: '#f2b705',
  cream:  '#efe6d6',
  navy:   '#20304d',
  teal:   '#0f8fa3'
};
const toon = (hex) => new THREE.MeshToonMaterial({ color: new THREE.Color(hex), gradientMap: ramp });

/* ---------------------------------------------------------------
   SCENE — chunky silhouettes, because outlines are only as good
   as the shapes underneath them.
--------------------------------------------------------------- */
const world = new THREE.Group();
scene.add(world);

const ground = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 0.5, 8), toon(INK.cream));
ground.position.y = -0.9;
world.add(ground);

const hero = new THREE.Mesh(new THREE.TorusKnotGeometry(1.35, 0.42, 190, 26), toon(INK.red));
hero.position.y = 1.5;
world.add(hero);

const orbiters = [];
const shapes = [
  new THREE.BoxGeometry(0.8, 0.8, 0.8),
  new THREE.OctahedronGeometry(0.6),
  new THREE.IcosahedronGeometry(0.55),
  new THREE.ConeGeometry(0.5, 1.1, 5),
  new THREE.TorusGeometry(0.5, 0.2, 12, 20)
];
const palette = [INK.blue, INK.yellow, INK.teal, INK.navy, INK.blue];
for (let i = 0; i < 9; i++) {
  const m = new THREE.Mesh(shapes[i % shapes.length], toon(palette[i % palette.length]));
  m.userData = {
    radius: 3.1 + (i % 3) * 0.9,
    speed: 0.22 + (i % 4) * 0.09,
    phase: (i / 9) * Math.PI * 2,
    height: 0.4 + (i % 5) * 0.55,
    tumble: 0.4 + i * 0.13
  };
  orbiters.push(m);
  world.add(m);
}

const pillars = new THREE.Group();
for (let i = 0; i < 6; i++) {
  const h = 1.2 + (i % 3) * 1.4;
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.55, h, 0.55), toon(i % 2 ? INK.navy : INK.cream));
  const a = (i / 6) * Math.PI * 2 + 0.4;
  p.position.set(Math.cos(a) * 6, h / 2 - 0.65, Math.sin(a) * 6);
  p.rotation.y = a;
  pillars.add(p);
}
world.add(pillars);

const key = new THREE.DirectionalLight('#ffffff', 2.6);
key.position.set(5, 8, 4);
scene.add(key);
const rim = new THREE.DirectionalLight('#7fb2ff', 1.1);
rim.position.set(-6, 2, -5);
scene.add(rim);
scene.add(new THREE.AmbientLight('#ffffff', 0.55));

/* ---------------------------------------------------------------
   G-BUFFER
   Pass 1: normals + depth.  Pass 2: banded colour.
--------------------------------------------------------------- */
let colorRT, normalRT;
const normalMat = new THREE.MeshNormalMaterial();

function buildTargets(w, h) {
  colorRT?.dispose();
  normalRT?.dispose();

  colorRT = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
  });
  colorRT.texture.colorSpace = THREE.SRGBColorSpace;

  const depth = new THREE.DepthTexture(w, h);
  depth.type = THREE.UnsignedIntType;
  normalRT = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthTexture: depth
  });
}

/* ---------------------------------------------------------------
   COMPOSITE PASS
--------------------------------------------------------------- */
const fsScene = new THREE.Scene();
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  tColor:     { value: null },
  tNormal:    { value: null },
  tDepth:     { value: null },
  uRes:       { value: new THREE.Vector2() },
  uDpr:       { value: 1 },
  uNear:      { value: camera.near },
  uFar:       { value: camera.far },
  uTime:      { value: 0 },
  uHalftone:  { value: 0.85 },
  uDotPitch:  { value: 5 },
  uSplit:     { value: 1 },
  uEdge:      { value: 1 },
  uThick:     { value: 1.4 },
  uBoil:      { value: 1 },
  uMisreg:    { value: 2 },
  uGrain:     { value: 0.35 },
  uBypass:    { value: 0 }
};

const compositeMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;

    uniform sampler2D tColor, tNormal, tDepth;
    uniform vec2  uRes;
    uniform float uDpr, uNear, uFar, uTime;
    uniform float uHalftone, uDotPitch, uSplit;
    uniform float uEdge, uThick, uBoil;
    uniform float uMisreg, uGrain, uBypass;

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    // depth buffer -> 0..1 linear
    float linDepth(vec2 uv){
      float d = texture2D(tDepth, uv).x;
      float z = d * 2.0 - 1.0;
      float v = (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
      return clamp(v / uFar, 0.0, 1.0);
    }

    mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

    // One ink plate. Coverage grows as sqrt(amount) so mid-tones read correctly.
    float plate(float amount, vec2 px, float angle, float pitch){
      vec2 p = rot(angle) * px;
      vec2 cell = mod(p, pitch) - pitch * 0.5;
      float r = sqrt(clamp(amount, 0.0, 1.0)) * pitch * 0.62;
      return smoothstep(r + 0.7, r - 0.7, length(cell));
    }

    void main(){
      vec2 texel = 1.0 / uRes;
      vec3 raw = texture2D(tColor, vUv).rgb;

      if (uBypass > 0.5){ gl_FragColor = vec4(raw, 1.0); return; }

      // --- line boil: sample jitter that only changes 12 times a second ---
      float frame = floor(uTime * 12.0);
      vec2 boil = uBoil > 0.5
        ? (vec2(hash(vec2(frame, 3.7)), hash(vec2(frame, 9.1))) - 0.5) * 1.6 * texel * uDpr
        : vec2(0.0);

      vec2 uv = vUv + boil;
      float dCenter = linDepth(uv);

      // --- misregistration: plates drift apart with distance from focus ---
      float defocus = clamp(abs(dCenter - linDepth(vec2(0.5))) * 6.0, 0.0, 1.0);
      vec2 off = vec2(uMisreg * (0.25 + defocus), 0.0) * texel * uDpr;
      vec3 col = vec3(
        texture2D(tColor, vUv + off).r,
        raw.g,
        texture2D(tColor, vUv - off).b
      );

      // --- outlines: sobel over linear depth + view normals ---
      vec2 s = texel * uThick * uDpr;
      float dE = 0.0, nE = 0.0;
      vec3 nC = normalize(texture2D(tNormal, uv).rgb * 2.0 - 1.0);
      for (int i = 0; i < 4; i++){
        vec2 dir = i == 0 ? vec2(1.0, 0.0) : i == 1 ? vec2(-1.0, 0.0)
                 : i == 2 ? vec2(0.0, 1.0) : vec2(0.0, -1.0);
        dE += abs(linDepth(uv + dir * s) - dCenter);
        vec3 nS = normalize(texture2D(tNormal, uv + dir * s).rgb * 2.0 - 1.0);
        nE += 1.0 - max(dot(nC, nS), 0.0);
      }
      float edge = clamp(dE * 70.0 + nE * 0.9, 0.0, 1.0);
      edge = smoothstep(0.35, 0.75, edge) * uEdge;

      // --- halftone ---
      vec2 px = gl_FragCoord.xy / uDpr;
      vec3 ht;
      if (uSplit > 0.5){
        // proper C / M / Y screen angles: 15deg, 75deg, 0deg -> rosette
        ht = vec3(
          1.0 - plate(1.0 - col.r, px, 0.2618, uDotPitch),
          1.0 - plate(1.0 - col.g, px, 1.3090, uDotPitch),
          1.0 - plate(1.0 - col.b, px, 0.0,    uDotPitch)
        );
      } else {
        float lum = dot(col, vec3(0.299, 0.587, 0.114));
        float k = plate(1.0 - lum, px, 0.3927, uDotPitch);
        ht = mix(col * 1.12, col * 0.42, k);
      }
      col = mix(col, ht, uHalftone);

      // --- ink the lines last so halftone never eats them ---
      col = mix(col, vec3(0.055, 0.045, 0.04), clamp(edge, 0.0, 1.0));

      // --- paper tooth ---
      float g = hash(floor(gl_FragCoord.xy / max(uDpr * 0.75, 1.0)) + frame * 0.017);
      col *= 1.0 - uGrain * 0.22 * g;
      col = mix(col, col * vec3(1.02, 0.995, 0.95), uGrain);

      gl_FragColor = vec4(col, 1.0);
    }
  `
});
compositeMat.depthTest = false;
compositeMat.depthWrite = false;
const fsQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compositeMat);
fsQuad.frustumCulled = false;
fsScene.add(fsQuad);

/* ---------------------------------------------------------------
   RESIZE
--------------------------------------------------------------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  const dpr = Math.min(devicePixelRatio, 2);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
  buildTargets(pw, ph);
  uniforms.tColor.value = colorRT.texture;
  uniforms.tNormal.value = normalRT.texture;
  uniforms.tDepth.value = normalRT.depthTexture;
  uniforms.uRes.value.set(pw, ph);
  uniforms.uDpr.value = dpr;
}
addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------
   SIM CLOCK — snapshots need a reproducible t, not wall time.
--------------------------------------------------------------- */
let simTime = 0;
let spinning = !reduceMotion;
const clock = new THREE.Clock();

function poseWorld(t) {
  hero.rotation.set(t * 0.31, t * 0.47, t * 0.13);
  hero.position.y = 1.5 + Math.sin(t * 0.9) * 0.22;
  for (const m of orbiters) {
    const u = m.userData;
    const a = u.phase + t * u.speed;
    m.position.set(Math.cos(a) * u.radius, u.height + Math.sin(t * 0.8 + u.phase) * 0.5, Math.sin(a) * u.radius);
    m.rotation.set(t * u.tumble, t * u.tumble * 0.7, 0);
  }
  pillars.rotation.y = t * 0.04;
}

/* ---------------------------------------------------------------
   RENDER LOOP
--------------------------------------------------------------- */
let pendingShot = null;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (spinning) simTime += dt;
  poseWorld(simTime);
  uniforms.uTime.value = simTime;
  controls.update();

  // pass 1 — normals + depth
  scene.overrideMaterial = normalMat;
  renderer.setRenderTarget(normalRT);
  renderer.render(scene, camera);

  // pass 2 — banded colour
  scene.overrideMaterial = null;
  renderer.setRenderTarget(colorRT);
  renderer.render(scene, camera);

  // pass 3 — the press
  renderer.setRenderTarget(null);
  renderer.render(fsScene, fsCam);

  if (pendingShot) { pendingShot(); pendingShot = null; }
}
frame();

/* ---------------------------------------------------------------
   PANELS
   A snapshot is just serialisable state. Restoring one is applying it.
--------------------------------------------------------------- */
const stripWrap = document.getElementById('strip-wrap');
const empty = document.getElementById('empty');
let panelNo = 0;

function takePanel() {
  pendingShot = () => {
    const shot = {
      url: renderer.domElement.toDataURL('image/png'),
      pos: camera.position.clone(),
      quat: camera.quaternion.clone(),
      target: controls.target.clone(),
      t: simTime,
      n: ++panelNo
    };
    empty.style.display = 'none';

    const fig = document.createElement('figure');
    fig.className = 'panel';
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    fig.style.transform = `rotate(${(Math.random() - 0.5) * 2.4}deg)`;
    fig.innerHTML = `<img alt="Panel ${shot.n}"><figcaption><span>P${String(shot.n).padStart(2, '0')}</span><span>${shot.t.toFixed(1)}s</span></figcaption>`;
    fig.querySelector('img').src = shot.url;

    const go = () => restore(shot);
    fig.addEventListener('click', go);
    fig.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });

    stripWrap.appendChild(fig);
    stripWrap.scrollTo({ left: stripWrap.scrollWidth, behavior: reduceMotion ? 'auto' : 'smooth' });
  };
}

function restore(shot) {
  simTime = shot.t;
  poseWorld(simTime);
  setSpin(false);
  if (reduceMotion) {
    camera.position.copy(shot.pos);
    controls.target.copy(shot.target);
    controls.update();
    return;
  }
  const from = { p: camera.position.clone(), t: controls.target.clone() };
  const start = performance.now();
  (function ease() {
    const k = Math.min((performance.now() - start) / 620, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(from.p, shot.pos, e);
    controls.target.lerpVectors(from.t, shot.target, e);
    controls.update();
    if (k < 1) requestAnimationFrame(ease);
  })();
}

/* ---------------------------------------------------------------
   CONTROLS
--------------------------------------------------------------- */
const fmt = {
  htMix:  v => Math.round(v * 100) + '%',
  htSize: v => (+v).toFixed(1) + 'px',
  edge:   v => (+v).toFixed(2),
  thick:  v => (+v).toFixed(1) + 'px',
  mis:    v => (+v).toFixed(1) + 'px',
  grain:  v => Math.round(v * 100) + '%'
};
const bind = (id, key) => {
  const el = document.getElementById(id), out = document.getElementById(id + 'V');
  const sync = () => { uniforms[key].value = +el.value; out.textContent = fmt[id](el.value); };
  el.addEventListener('input', sync);
  sync();
};
bind('htMix', 'uHalftone');
bind('htSize', 'uDotPitch');
bind('edge', 'uEdge');
bind('thick', 'uThick');
bind('mis', 'uMisreg');
bind('grain', 'uGrain');

const toggle = (id, fn) => {
  const el = document.getElementById(id);
  el.addEventListener('click', () => {
    const on = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', String(on));
    fn(on);
  });
  return el;
};
toggle('togPlates', on => uniforms.uSplit.value = on ? 1 : 0);
toggle('togBoil', on => uniforms.uBoil.value = on ? 1 : 0);
toggle('togRaw', on => uniforms.uBypass.value = on ? 1 : 0);

const spinBtn = toggle('togSpin', on => spinning = on);
function setSpin(on) { spinning = on; spinBtn.setAttribute('aria-pressed', String(on)); }
setSpin(!reduceMotion);

document.getElementById('shoot').addEventListener('click', takePanel);
document.getElementById('clear').addEventListener('click', () => {
  stripWrap.querySelectorAll('.panel').forEach(p => p.remove());
  empty.style.display = '';
  panelNo = 0;
});
addEventListener('keydown', e => {
  if (e.code === 'Space' && !/^(INPUT|BUTTON|FIGURE)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); takePanel();
  }
});
</script>
